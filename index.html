<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Up — Multiplayer</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #333;
            --gold: #d4af37;
            --accent: #4f46e5;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        button, select, input { background: #2a2a2a; color: white; border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-size: 1em; }
        button { cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); border: none; }
        .btn-alt { background: #374151; border: none; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal.hidden { display: none; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Count Up — Multiplayer</h1>
        
        <!-- Setup Panel -->
        <div id="setupPanel" class="card">
            <h2>Game Setup</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label>Players (comma separated):</label>
                <input type="text" id="playerNamesInput" value="Herb, Kelly">
                
                <label>Game Mode:</label>
                <select id="gameMode">
                    <option value="Count Up">Count Up</option>
                    <option value="Count Up (Quad)">Count Up (Quad)</option>
                </select>

                <label>Board Type:</label>
                <select id="boardType">
                    <option value="standard">Standard</option>
                    <option value="quad">Quad</option>
                </select>

                <label>Match Date:</label>
                <input type="date" id="matchDate">

                <label><input type="checkbox" id="randomizePlayers"> Randomize Player Order</label>

                <button class="btn-primary" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <!-- Game Panel -->
        <div id="gamePanel" class="card hidden">
            <h2 id="modeLabel">Count Up</h2>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>Current: <strong id="currentPlayer" style="color: var(--gold);">—</strong></span>
                <span>Round: <strong id="roundLabel">1 / 8</strong></span>
                <span>Dart: <strong id="dartLabel">1 / 3</strong></span>
            </div>
            <div id="announcement" style="margin-bottom: 15px; font-weight: bold; color: var(--gold);"></div>
            
            <div id="targetGrid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px;"></div>
            
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <button class="mult-btn" data-mult="1" onclick="setMultiplier(1)">Single</button>
                <button class="mult-btn" data-mult="2" onclick="setMultiplier(2)">Double</button>
                <button class="mult-btn" data-mult="3" onclick="setMultiplier(3)">Triple</button>
                <button id="quadBtn" class="mult-btn hidden" data-mult="4" onclick="setMultiplier(4)">Quad</button>
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn-alt" onclick="recordThrow('MISS')" style="flex: 1;">Miss</button>
                <button class="btn-alt" onclick="undoThrow()" style="flex: 1;">Undo</button>
                <button class="btn-primary" onclick="endTurn()" style="flex: 1;">End Turn</button>
            </div>

            <!-- Scoreboard Table -->
            <table id="scoreboardTable" style="margin-top: 20px;">
                <thead><tr id="scoreboardHeader"><th>Round</th></tr></thead>
                <tbody id="scoreboardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Final Scoreboard Modal -->
    <div id="eventSummaryModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: var(--gold); margin-top: 0;">🏁 Final Scoreboard</h2>
            <div id="modalSummaryText" style="margin-bottom: 15px; color: var(--muted);"></div>
            
            <table>
                <thead>
                    <tr><th>Rank</th><th>Player</th><th>Score</th><th>PPR</th></tr>
                </thead>
                <tbody id="overallLeaderboardBody"></tbody>
            </div>

            <!-- League Integration Container -->
            <div id="leagueButtonContainer" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <label style="font-size: 0.85em; color: var(--muted);">Select Target Hellcastle League:</label>
                <select id="targetLeagueSelect" style="width: 100%; padding: 10px;">
                    <option value="Royal Couple">Royal Couple</option>
                    <option value="Papal 1">Papal 1</option>
                    <option value="Hellcastle Archery League">Hellcastle Archery League</option>
                </select>

                <button class="btn-alt" id="copyLeagueResultsBtn" style="width: 100%; padding: 10px;">📋 Copy Results for Hellcastle League</button>
                <button class="btn-primary" id="sendToLeagueBtn" style="width: 100%; padding: 10px;">🚀 Send to League Form</button>
            </div>

            <button class="btn-alt" onclick="resetGameSetup()" style="width: 100%; margin-top: 15px; padding: 10px;">New Game Setup</button>
        </div>
    </div>

    <script>
        const MODE_ROUNDS = { "Count Up": 8, "Count Up (Quad)": 8 };
        let state = {
            players: [],
            boardType: "standard",
            mode: "Count Up",
            totalRounds: 8,
            currentPlayer: 0,
            currentRound: 1,
            currentDart: 1,
            multiplier: 1,
            gameStarted: false,
            gameOver: false,
            totals: [],
            roundScores: [],
            selectedDate: new Date().toISOString().slice(0, 10)
        };

        const els = {
            setupPanel: document.getElementById("setupPanel"),
            gamePanel: document.getElementById("gamePanel"),
            eventSummaryModal: document.getElementById("eventSummaryModal"),
            playerNamesInput: document.getElementById("playerNamesInput"),
            gameMode: document.getElementById("gameMode"),
            boardType: document.getElementById("boardType"),
            matchDate: document.getElementById("matchDate"),
            randomizePlayers: document.getElementById("randomizePlayers"),
            currentPlayer: document.getElementById("currentPlayer"),
            roundLabel: document.getElementById("roundLabel"),
            dartLabel: document.getElementById("dartLabel"),
            announcement: document.getElementById("announcement"),
            targetGrid: document.getElementById("targetGrid"),
            quadBtn: document.getElementById("quadBtn"),
            overallLeaderboardBody: document.getElementById("overallLeaderboardBody"),
            modalSummaryText: document.getElementById("modalSummaryText")
        };

        // Set default date
        els.matchDate.value = new Date().toISOString().slice(0, 10);

        function calcPointsPerRound(score, rounds) {
            return (score / rounds).toFixed(2);
        }

        function buildTargetButtons() {
            els.targetGrid.innerHTML = "";
            for (let i = 1; i <= 20; i++) {
                const btn = document.createElement("button");
                btn.className = "target-btn";
                btn.textContent = i;
                btn.addEventListener("click", () => recordThrow(i));
                els.targetGrid.appendChild(btn);
            }
            const bull = document.createElement("button");
            bull.className = "target-btn bull";
            bull.textContent = "Bull";
            bull.addEventListener("click", () => recordThrow("BULL"));
            els.targetGrid.appendChild(bull);
        }

        function startGame() {
            const rawNames = els.playerNamesInput.value.split(",").map(n => n.trim()).filter(Boolean);
            if (rawNames.length === 0) {
                alert("Please enter at least one player name.");
                return;
            }
            state.players = rawNames;
            state.boardType = els.boardType.value;
            state.mode = els.gameMode.value;
            state.totalRounds = MODE_ROUNDS[state.mode] || 8;
            state.selectedDate = els.matchDate.value || new Date().toISOString().slice(0, 10);
            
            state.currentPlayer = 0;
            state.currentRound = 1;
            state.currentDart = 1;
            state.multiplier = 1;
            state.totals = state.players.map(() => 0);
            state.roundScores = state.players.map(() => Array(state.totalRounds).fill(0));
            state.gameOver = false;

            buildTargetButtons();
            els.setupPanel.classList.add("hidden");
            els.gamePanel.classList.remove("hidden");
            els.quadBtn.classList.toggle("hidden", state.boardType !== "quad");

            updateMeta();
            renderScoreboard();
        }

        function setMultiplier(m) {
            state.multiplier = m;
            document.querySelectorAll(".mult-btn").forEach(b => {
                b.style.background = Number(b.dataset.mult) === m ? "var(--gold)" : "#2a2a2a";
                b.style.color = Number(b.dataset.mult) === m ? "#000" : "#fff";
            });
        }

        function recordThrow(target) {
            if (state.gameOver) return;
            let pts = 0;
            if (target === "BULL") {
                pts = state.multiplier === 2 ? 50 : 50; // Standard bull handling
            } else if (target !== "MISS") {
                pts = Number(target) * state.multiplier;
            }

            state.roundScores[state.currentPlayer][state.currentRound - 1] += pts;
            state.currentDart++;

            if (state.currentDart > 3) {
                endTurn();
            } else {
                updateMeta();
                renderScoreboard();
            }
        }

        function endTurn() {
            if (state.gameOver) return;
            state.currentDart = 1;
            state.currentPlayer++;
            if (state.currentPlayer >= state.players.length) {
                state.currentPlayer = 0;
                state.currentRound++;
                if (state.currentRound > state.totalRounds) {
                    endGame();
                    return;
                }
            }
            setMultiplier(1);
            updateMeta();
            renderScoreboard();
        }

        function undoThrow() {
            // Simplified stub for undo
        }

        function updateMeta() {
            els.currentPlayer.textContent = state.players[state.currentPlayer] || "—";
            els.modeLabel.textContent = `${state.mode} ${state.boardType === "quad" ? "(Quad)" : ""}`;
            els.roundLabel.textContent = `${Math.min(state.currentRound, state.totalRounds)} / ${state.totalRounds}`;
            els.dartLabel.textContent = `${state.currentDart} / 3`;
        }

        function renderScoreboard() {
            const headerTr = document.getElementById("scoreboardHeader");
            let hHtml = "<th>Round</th>";
            state.players.forEach(p => hHtml += `<th>${p}</th>`);
            headerTr.innerHTML = hHtml;

            const tbody = document.getElementById("scoreboardBody");
            let bHtml = "";
            for (let r = 0; r < state.totalRounds; r++) {
                bHtml += `<tr><td>R${r + 1}</td>`;
                state.players.forEach((p, pIdx) => {
                    bHtml += `<td>${state.roundScores[pIdx][r]}</td>`;
                });
                bHtml += `</tr>`;
            }

            // Totals
            state.totals = state.roundScores.map(rArr => rArr.reduce((a, b) => a + b, 0));
            bHtml += `<tr style="font-weight: bold; color: var(--gold);"><td>Total</td>`;
            state.totals.forEach(t => bHtml += `<td>${t}</td>`);
            bHtml += `</tr>`;
            tbody.innerHTML = bHtml;
        }

        function endGame() {
            state.gameOver = true;
            showOverallLeaderboardModal();
        }

        function showOverallLeaderboardModal() {
            els.overallLeaderboardBody.innerHTML = "";
            const standings = state.players
                .map((name, i) => ({ name: name, score: state.totals[i] || 0 }))
                .sort((a, b) => b.score - a.score);
            
            standings.forEach((player, idx) => {
                const ppr = calcPointsPerRound(player.score, state.totalRounds);
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${player.name}</td>
                    <td><strong>${player.score}</strong></td>
                    <td>${ppr}</td>
                `;
                els.overallLeaderboardBody.appendChild(row);
            });

            els.modalSummaryText.textContent = `${standings[0].name} wins with ${standings[0].score}!`;

            // Restore last selected target league preference
            const lastLeague = localStorage.getItem("haalis_selected_target_league");
            if (lastLeague) {
                document.getElementById("targetLeagueSelect").value = lastLeague;
            }

            // Bind Event Listeners for the League Buttons
            document.getElementById("copyLeagueResultsBtn").onclick = () => {
                let report = `--- HELLCASTLE LEAGUE MATCH REPORT ---\n`;
                report += `Event: ${state.mode}${state.boardType === "quad" ? " (Quad)" : ""}\n`;
                report += `Date: ${state.selectedDate}\n\n`;
                
                state.players.forEach((p, idx) => {
                    const score = state.totals[idx] || 0;
                    const ppr = calcPointsPerRound(score, state.totalRounds);
                    report += `${p}: ${score} pts (PPR: ${ppr})\n`;
                });
                
                navigator.clipboard.writeText(report).then(() => {
                    const btn = document.getElementById("copyLeagueResultsBtn");
                    btn.textContent = "✅ Copied Match Report!";
                    setTimeout(() => { btn.textContent = "📋 Copy Results for Hellcastle League"; }, 2500);
                });
            };

            document.getElementById("sendToLeagueBtn").onclick = () => {
                const chosenLeague = document.getElementById("targetLeagueSelect").value;
                localStorage.setItem("haalis_selected_target_league", chosenLeague);

                const leaguePayload = {
                    leagueName: chosenLeague,
                    event: state.mode,
                    date: state.selectedDate,
                    players: state.players.map((p, idx) => ({
                        name: p,
                        score: state.totals[idx] || 0,
                        ppr: calcPointsPerRound(state.totals[idx] || 0, state.totalRounds)
                    }))
                };

                localStorage.setItem("haalis_pending_match", JSON.stringify(leaguePayload));
                window.location.href = "https://herbenero.github.io/Hellcastle-League/";
            };

            els.eventSummaryModal.classList.remove("hidden");
        }

        function resetGameSetup() {
            els.eventSummaryModal.classList.add("hidden");
            els.gamePanel.classList.add("hidden");
            els.setupPanel.classList.remove("hidden");
        }
    </script>
</body>
</html>
