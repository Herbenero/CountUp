<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Count Up (Multiplayer)</title>
  <meta name="description" content="Count Up darts app — multiplayer session game" />
  <style>
    :root {
      --bg: #f5efe5;
      --ink: #1d1916;
      --muted: #6d6257;
      --accent: #b44d2c;
      --good: #2f7d4d;
      --warn: #9b2e2e;
      --paper: #faf4eb;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--ink);
      padding: 18px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
    }
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-teal {
      background: #1e5b6d;
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-teal:hover {
      background: #174857;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Count Up — Multiplayer</h1>
        <div style="color:var(--muted);font-size:.9rem">Count Up, Count Up15, Quickdraw</div>
      </div>
      <div class="controls-row">
        <a href="https://herbenero.github.io/DartKeep/" class="btn btn-teal">Home</a>
        <button id="historyToggle" class="btn btn-teal">History</button>
      </div>
    </header>
  </div>
</body>
</html>
