<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Count Up (Multiplayer)</title>
  <meta name="description" content="Count Up darts app — multiplayer" />
  <style>
    :root {
      --bg: #f5efe5;
      --ink: #1d1916;
      --muted: #6d6257;
      --accent: #b44d2c;
      --good: #2f7d4d;
      --warn: #9b2e2e;
      --paper: #faf4eb;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background-color: var(--bg);
      background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('Archery.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--ink);
      padding: 18px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .panel { background: var(--paper); padding: 14px; border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,.06); }
    #missBtn { color: #0a0000; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
    .player-list { display: grid; gap: 8px; margin-top: 8px; }
    .player-row { display: flex; gap: 8px; }
    input[type="text"] { padding: 8px; border-radius: 8px; border: 1px solid #ddd; flex: 1; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; background: #eee; cursor: pointer; }
    button.btn { background: var(--accent); color: #fff; }
    button.btn-alt { background: #333; color: #fff; }
    button.btn-danger { background: var(--warn); color: #fff; }
    .hidden { display: none !important; }
    .app-layout { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
    .scoreboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .scoreboard-table th, .scoreboard-table td { padding: 8px; text-align: center; border-bottom: 1px solid #ddd; }
    .active-row { background: rgba(180, 77, 44, 0.12); font-weight: bold; }
    .dart-pills { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
    .pill { padding: 4px 10px; border-radius: 999px; background: #ddd; font-size: 0.9rem; }
    .pill.used { background: var(--accent); color: #fff; }
    .grid-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; margin-top: 10px; }
    .mult-row { display: flex; gap: 6px; margin-top: 8px; }
    .mult-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .mult-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .announcement { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
    .announcement.good { background: #e6f4ea; color: var(--good); }
    .announcement.warn { background: #fce8e6; color: var(--warn); }
    .announcement.info { background: #e8f0fe; color: #1a73e8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Count Up</h1>
    </header>

    <div class="app-layout">
      <main>
        <!-- Setup Panel -->
        <section id="setupPanel" class="panel">
          <h2>Game Setup</h2>
          <div style="display: flex; gap: 12px; margin-bottom: 12px;">
            <label>
              <strong>Rounds:</strong>
              <input type="number" id="roundsInput" value="8" min="1" max="20" style="width: 60px; padding: 6px;" />
            </label>
            <label>
              <strong>Board:</strong>
              <select id="boardTypeSelect" style="padding: 6px;">
                <option value="standard">Standard Board</option>
                <option value="quad">Quad Board</option>
              </select>
            </label>
          </div>

          <label><strong>Match Date:</strong></label>
          <input type="date" id="matchDate" style="padding: 6px; margin-bottom: 12px;" />

          <div>
            <strong>Players:</strong>
            <div id="playerList" class="player-list"></div>
            <button id="addPlayerBtn" style="margin-top: 8px;">+ Add Player</button>
          </div>

          <div style="margin-top: 16px;">
            <button id="startGameBtn" class="btn">Start Game</button>
          </div>
        </section>

        <!-- Game Panel -->
        <section id="gamePanel" class="panel hidden">
          <div id="announcement" class="announcement info hidden"></div>
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="turnHeading" style="margin: 0;">Player's Turn</h2>
            <span id="roundIndicator" style="font-weight: bold; color: var(--muted);">Round 1 / 8</span>
          </div>

          <div class="dart-pills" id="dartPills">
            <span class="pill">Dart 1: -</span>
            <span class="pill">Dart 2: -</span>
            <span class="pill">Dart 3: -</span>
          </div>

          <div class="mult-row" id="multRow">
            <button class="mult-btn active" data-mult="1">Single (1x)</button>
            <button class="mult-btn" data-mult="2">Double (2x)</button>
            <button class="mult-btn" data-mult="3">Triple (3x)</button>
          </div>

          <div class="grid-buttons" id="targetButtons"></div>

          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button id="missBtn" class="btn-alt" style="flex: 1;">MISS (0)</button>
            <button id="undoBtn" style="flex: 1;">Undo Dart</button>
            <button id="endTurnBtn" class="btn" style="flex: 1;">End Turn</button>
          </div>

          <div style="margin-top: 16px;">
            <h3>Scoreboard</h3>
            <table class="scoreboard-table">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Current Round</th>
                  <th>Total Score</th>
                </tr>
              </thead>
              <tbody id="scoreboardBody"></tbody>
            </table>
          </div>
        </section>

        <!-- Final Summary Panel -->
        <section id="finalPanel" class="panel hidden" style="margin-top: 16px;">
          <h2>Game Over!</h2>
          <p id="finalSummary"></p>
          <button id="newGameBtn" class="btn">Start New Game</button>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    function todayStr() {
      return new Date().toISOString().split('T')[0];
    }

    const state = {
      rounds: 8,
      boardType: "standard",
      players: [],
      currentRound: 1,
      currentPlayerIndex: 0,
      dartsThrown: 0,
      currentTurnDarts: [],
      scoresHistory: [],
      totals: [],
      multiplier: 1,
      gameOver: false,
      mode: "Count Up"
    };

    const els = {
      setupPanel: document.getElementById("setupPanel"),
      gamePanel: document.getElementById("gamePanel"),
      finalPanel: document.getElementById("finalPanel"),
      playerList: document.getElementById("playerList"),
      addPlayerBtn: document.getElementById("addPlayerBtn"),
      startGameBtn: document.getElementById("startGameBtn"),
      roundsInput: document.getElementById("roundsInput"),
      boardTypeSelect: document.getElementById("boardTypeSelect"),
      matchDate: document.getElementById("matchDate"),
      turnHeading: document.getElementById("turnHeading"),
      roundIndicator: document.getElementById("roundIndicator"),
      dartPills: document.getElementById("dartPills"),
      multRow: document.getElementById("multRow"),
      targetButtons: document.getElementById("targetButtons"),
      missBtn: document.getElementById("missBtn"),
      undoBtn: document.getElementById("undoBtn"),
      endTurnBtn: document.getElementById("endTurnBtn"),
      scoreboardBody: document.getElementById("scoreboardBody"),
      finalSummary: document.getElementById("finalSummary"),
      newGameBtn: document.getElementById("newGameBtn"),
      announcement: document.getElementById("announcement")
    };

    function setAnnouncement(msg, type = "info") {
      if (!msg) {
        els.announcement.classList.add("hidden");
        return;
      }
      els.announcement.className = `announcement ${type}`;
      els.announcement.textContent = msg;
      els.announcement.classList.remove("hidden");
    }

    function addPlayerField(name = "") {
      const row = document.createElement("div");
      row.className = "player-row";
      
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `Player ${els.playerList.children.length + 1}`;
      input.value = name;

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "✕";
      removeBtn.className = "btn-danger";
      removeBtn.onclick = () => {
        if (els.playerList.children.length > 1) {
          row.remove();
        }
      };

      row.appendChild(input);
      row.appendChild(removeBtn);
      els.playerList.appendChild(row);
    }

    function buildTargetButtons() {
      els.targetButtons.innerHTML = "";
      for (let i = 1; i <= 20; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.onclick = () => recordScore(i);
        els.targetButtons.appendChild(btn);
      }
      const bullBtn = document.createElement("button");
      bullBtn.textContent = "Bull (25)";
      bullBtn.onclick = () => recordScore(25);
      els.targetButtons.appendChild(bullBtn);
    }

    function startGame() {
      const inputs = els.playerList.querySelectorAll("input");
      const names = Array.from(inputs).map(inp => inp.value.trim()).filter(Boolean);

      if (names.length === 0) {
        alert("Please enter at least one player name.");
        return;
      }

      state.players = names;
      state.rounds = parseInt(els.roundsInput.value, 10) || 8;
      state.boardType = els.boardTypeSelect.value;
      state.currentRound = 1;
      state.currentPlayerIndex = 0;
      state.dartsThrown = 0;
      state.currentTurnDarts = [];
      state.scoresHistory = state.players.map(() => []);
      state.totals = state.players.map(() => 0);
      state.multiplier = 1;
      state.gameOver = false;

      els.setupPanel.classList.add("hidden");
      els.finalPanel.classList.add("hidden");
      els.gamePanel.classList.remove("hidden");

      updateMeta();
      renderScoreboard();
      setAnnouncement("");
    }

    function recordScore(baseValue) {
      if (state.gameOver || state.dartsThrown >= 3) return;

      let mult = state.multiplier;
      if (baseValue === 25 && mult > 2) mult = 2; // Bullseye max multiplier is Double

      const score = baseValue * mult;
      state.currentTurnDarts.push({ baseValue, mult, score });
      state.dartsThrown++;
      state.multiplier = 1;

      updateMeta();

      if (state.dartsThrown === 3) {
        setTimeout(endTurn, 300);
      }
    }

    function recordMiss() {
      recordScore(0);
    }

    function undo() {
      if (state.currentTurnDarts.length > 0) {
        state.currentTurnDarts.pop();
        state.dartsThrown--;
        state.multiplier = 1;
        updateMeta();
      }
    }

    function endTurn() {
      if (state.currentTurnDarts.length === 0 && state.dartsThrown === 0) return;

      const turnTotal = state.currentTurnDarts.reduce((sum, d) => sum + d.score, 0);
      const pIdx = state.currentPlayerIndex;

      state.scoresHistory[pIdx].push([...state.currentTurnDarts]);
      state.totals[pIdx] += turnTotal;

      state.currentTurnDarts = [];
      state.dartsThrown = 0;
      state.multiplier = 1;

      state.currentPlayerIndex++;
      if (state.currentPlayerIndex >= state.players.length) {
        state.currentPlayerIndex = 0;
        state.currentRound++;
      }

      if (state.currentRound > state.rounds) {
        finishGame();
      } else {
        updateMeta();
        renderScoreboard();
      }
    }

    function finishGame() {
      state.gameOver = true;
      renderScoreboard();
      els.finalPanel.classList.remove("hidden");

      const maxScore = Math.max(...state.totals);
      const winners = state.players.filter((_, i) => state.totals[i] === maxScore);
      let summary = "";

      if (state.players.length === 1) {
        summary = `${state.players[0]} finished with a total score of ${maxScore}.`;
      } else {
        summary = winners.length === 1 ? `${winners[0]} wins with ${maxScore}.` : `Tie at ${maxScore} between ${winners.join(", ")}.`;
      }

      els.finalSummary.textContent = `${state.mode}${state.boardType === "quad" ? " (Quad Board)" : ""} • ${summary}`;
      setAnnouncement(summary, "good");
    }

    function updateMeta() {
      const pName = state.players[state.currentPlayerIndex] || "";
      els.turnHeading.textContent = `${pName}'s Turn`;
      els.roundIndicator.textContent = `Round ${Math.min(state.currentRound, state.rounds)} / ${state.rounds}`;

      // Update Dart Pills
      const pills = els.dartPills.children;
      for (let i = 0; i < 3; i++) {
        const dart = state.currentTurnDarts[i];
        if (dart) {
          let label = `${dart.score}`;
          if (dart.mult === 2) label += " (D)";
          if (dart.mult === 3) label += " (T)";
          pills[i].textContent = `Dart ${i + 1}: ${label}`;
          pills[i].classList.add("used");
        } else {
          pills[i].textContent = `Dart ${i + 1}: -`;
          pills[i].classList.remove("used");
        }
      }

      // Update Multiplier buttons active state
      const multBtns = els.multRow.querySelectorAll(".mult-btn");
      multBtns.forEach(btn => {
        const m = Number(btn.dataset.mult);
        btn.classList.toggle("active", m === state.multiplier);
      });
    }

    function renderScoreboard() {
      els.scoreboardBody.innerHTML = "";
      state.players.forEach((player, idx) => {
        const row = document.createElement("tr");
        if (!state.gameOver && idx === state.currentPlayerIndex) {
          row.className = "active-row";
        }

        const nameTd = document.createElement("td");
        nameTd.textContent = player;

        const roundTd = document.createElement("td");
        const playerHistory = state.scoresHistory[idx] || [];
        const lastTurn = playerHistory[playerHistory.length - 1];
        if (lastTurn) {
          const sum = lastTurn.reduce((a, b) => a + b.score, 0);
          roundTd.textContent = `${sum} pts`;
        } else {
          roundTd.textContent = "-";
        }

        const totalTd = document.createElement("td");
        totalTd.textContent = state.totals[idx] || 0;

        row.appendChild(nameTd);
        row.appendChild(roundTd);
        row.appendChild(totalTd);
        els.scoreboardBody.appendChild(row);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      addPlayerField("Player 1");
      addPlayerField("Player 2");

      els.addPlayerBtn.addEventListener("click", () => addPlayerField());
      els.startGameBtn.addEventListener("click", startGame);
      els.undoBtn.addEventListener("click", undo);
      els.endTurnBtn.addEventListener("click", endTurn);
      els.missBtn.addEventListener("click", recordMiss);

      els.newGameBtn.addEventListener("click", () => {
        els.setupPanel.classList.remove("hidden");
        els.gamePanel.classList.add("hidden");
        els.finalPanel.classList.add("hidden");
      });

      els.multRow.addEventListener("click", (e) => {
        const btn = e.target.closest(".mult-btn[data-mult]");
        if (!btn) return;
        state.multiplier = Number(btn.dataset.mult);
        updateMeta();
      });

      els.matchDate.value = todayStr();
      buildTargetButtons();
    });
  </script>
</body>
</html>
