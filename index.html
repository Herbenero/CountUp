<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Count Up</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.secondary {
      background: #4b5563;
    }
    button.secondary:hover {
      background: #374151;
    }
    button.active {
      background: #dc2626 !important; /* Highlights Quad mode when selected */
    }
    .hidden {
      display: none !important;
    }

    /* Standard Dartboard Grid */
    .dartboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    
    .multiplier-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .bull-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    /* Quad Specific Board Styling */
    .quad-indicator {
      margin-top: 10px;
      padding: 6px;
      background: #7f1d1d;
      color: #fca5a5;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dartboard Input</h2>

    <!-- Multipliers & Miss -->
    <div class="multiplier-row">
      <button id="missBtn" class="secondary">Miss</button>
      <button class="mult-btn" data-m="2">Double</button>
      <button class="mult-btn" data-m="3">Triple</button>
      <button id="quadToggleBtn" class="mult-btn" data-m="4">Quad</button>
    </div>

    <!-- Active Quad Mode Notification -->
    <div id="quadBanner" class="quad-indicator hidden">Quad Ring Active (4x)</div>

    <!-- Numbers 1 through 20 -->
    <div class="dartboard-grid" id="numberBoard">
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="10">10</button>
      <button data-value="11">11</button>
      <button data-value="12">12</button>
      <button data-value="13">13</button>
      <button data-value="14">14</button>
      <button data-value="15">15</button>
      <button data-value="16">16</button>
      <button data-value="17">17</button>
      <button data-value="18">18</button>
      <button data-value="19">19</button>
      <button data-value="20">20</button>
    </div>

    <!-- Bullseye options -->
    <div class="bull-row">
      <button data-bull="25">Bull</button>
      <button data-bull="50">Double Bull</button>
    </div>
  </div>

  <script>
    let activeMultiplier = 1;
    const quadBtn = document.getElementById('quadToggleBtn');
    const quadBanner = document.getElementById('quadBanner');
    const multBtns = document.querySelectorAll('.mult-btn');

    multBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const multVal = parseInt(btn.getAttribute('data-m'), 10);

        // Toggle state off if clicking the currently active multiplier button
        if (activeMultiplier === multVal) {
          activeMultiplier = 1;
          btn.classList.remove('active');
          quadBanner.classList.add('hidden');
        } else {
          // Clear active state from all buttons
          multBtns.forEach(b => b.classList.remove('active'));

          // Set new active multiplier
          activeMultiplier = multVal;
          btn.classList.add('active');

          // Show Quad indicator only when Quad is selected
          if (multVal === 4) {
            quadBanner.classList.remove('hidden');
          } else {
            quadBanner.classList.add('hidden');
          }
        }
      });
    });
  </script>

</body>
</html>
